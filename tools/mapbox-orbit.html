<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.js"></script>
<style>body{margin:0}#map{width:%%W%%px;height:%%H%%px}</style></head><body>
<div id="map"></div>
<script>
mapboxgl.accessToken = "%%TOKEN%%";
const LNG = %%LNG%%, LAT = %%LAT%%;
const map = new mapboxgl.Map({
  container: 'map', style: 'mapbox://styles/mapbox/satellite-streets-v12',
  center: [LNG, LAT], zoom: 15.5, pitch: 0, bearing: 0,
  preserveDrawingBuffer: true, antialias: true, fadeDuration: 0, interactive: false
});
map.on('load', () => {
  map.addSource('dem', { type: 'raster-dem', url: 'mapbox://mapbox.terrain-rgb', tileSize: 512, maxzoom: 14 });
  map.setTerrain({ source: 'dem', exaggeration: 1.5 });
  map.setFog({ 'range': [0.8, 8], 'horizon-blend': 0.5, 'color': '#8fbce6', 'high-color': '#245', 'space-color': '#0a1a2a', 'star-intensity': 0 });
  const layers = map.getStyle().layers;
  const labelLayer = layers.find(l => l.type === 'symbol' && l.layout && l.layout['text-field']);
  map.addLayer({
    id: 'buildings3d', source: 'composite', 'source-layer': 'building',
    filter: ['==', 'extrude', 'true'], type: 'fill-extrusion', minzoom: 14,
    paint: { 'fill-extrusion-color': '#cfd8e3',
      'fill-extrusion-height': ['interpolate', ['linear'], ['get', 'height'], 0, 0, 50, 50],
      'fill-extrusion-base': ['get', 'min_height'], 'fill-extrusion-opacity': 0.85 }
  }, labelLayer ? labelLayer.id : undefined);
  window.READY = true;
});
window.setCam = (zoom, pitch, bearing) => {
  map.jumpTo({ center: [LNG, LAT], zoom, pitch, bearing });
};
</script></body></html>
