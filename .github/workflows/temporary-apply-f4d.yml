name: Temporary apply verified F4D commit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate-upstream-f4d-manifest
          fetch-depth: 0
      - name: Import and merge exact F4D commit
        env:
          F4D_BUNDLE_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$F4D_BUNDLE_B64" | base64 --decode > /tmp/f4d.bundle
          git fetch /tmp/f4d.bundle 218660fd13b6c9ebe4ffb18ddf5d60b05adaa141
          git config user.name 'Instinct Agent'
          git config user.email 'agent@instinct.com'
          git merge --no-ff --no-edit 218660fd13b6c9ebe4ffb18ddf5d60b05adaa141
          git merge-base --is-ancestor 218660fd13b6c9ebe4ffb18ddf5d60b05adaa141 HEAD
          git diff --quiet 218660fd13b6c9ebe4ffb18ddf5d60b05adaa141 -- package.json scripts/package-boundaries.json src/f4d/manifest.js src/f4d/manifest.test.mjs
          git push origin HEAD:integrate-upstream-f4d-manifest
